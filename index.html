<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>איתור סטודנט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>איתור סטודנט</h1>
    <nav class="nav">
      <a href="/">איתור</a>
      <a href="/purchases">רשימת רכישות</a>
      <a href="/admin" data-admin hidden>ניהול</a>
      <button id="logout" type="button">יציאה</button>
    </nav>
  </header>

  <div id="noList" class="banner warn" hidden>עדיין לא הועלה קובץ סטודנטים. מנהל צריך להעלות אותו בעמוד "ניהול".</div>
  <div id="saved" class="banner ok" hidden></div>

  <div id="slots" class="slots"></div>

  <div class="add-row" id="addRow" hidden>
    <button class="btn big add-person" type="button" id="addPerson"><span aria-hidden="true">+</span> הוספה</button>
    <span class="muted">אדם נוסף באותה רכישה, כרטיס אחד לכל אדם</span>
  </div>

  <section class="card checkout" id="checkout" hidden>
    <h2 class="checkout-title">רישום רכישה</h2>
    <ol class="cart" id="cartList"></ol>
    <form class="buy" id="buyForm" autocomplete="off">
      <div class="field"><label for="invoice">מספר חשבונית</label><input id="invoice" class="mono" dir="ltr" required></div>
      <button class="btn ok big" type="submit" id="saveBtn">שמירה</button>
      <button class="btn big" type="button" id="cancelAll">ביטול הרכישה</button>
      <p class="msg" id="buyMsg" hidden></p>
    </form>
  </section>
</div>
<div class="cam-overlay" id="camOverlay" hidden role="dialog" aria-modal="true" aria-label="סריקה במצלמה">
  <div class="cam-box">
    <p class="cam-title">כוונו את המצלמה לברקוד שעל התעודה</p>
    <div id="camView"></div>
    <p class="cam-msg" id="camMsg">מפעיל מצלמה…</p>
    <button class="btn big" type="button" id="camClose">ביטול</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/common.js"></script>
<script>
const CAM_SVG = (n) => `<svg viewBox="0 0 24 24" width="ICON" height="ICON" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>`.replace(/ICON/g, n);
const TOUCH = matchMedia('(pointer: coarse)').matches;
let slots = [], seq = 0, activeKey = null, fieldsCache = null;

document.addEventListener('me', e => { $('#noList').hidden = e.detail.students > 0; });

/* ---------- slots: one per person in this purchase ---------- */
const slotEl = key => document.querySelector(`.slot[data-key="${key}"]`);
const slotOf = key => slots.find(s => s.key === key);
const inCart = s => s.status === 'found' && !s.purchase && !s.dup;

function addSlot() {
  const s = { key: ++seq, status: 'idle' };
  slots.push(s);
  const el = document.createElement('section');
  el.className = 'slot'; el.dataset.key = s.key;
  el.innerHTML = `
    <div class="slot-head"><h2 class="slot-title"></h2><button type="button" class="btn slot-remove" data-remove>הסרה</button></div>
    <form class="scan" autocomplete="off">
      <label for="scan${s.key}">סריקת ברקוד או הקלדת מספר זהות</label>
      <input id="scan${s.key}" class="scan-input" inputmode="numeric" placeholder="מספר זהות">
      <div class="scan-actions">
        <button class="btn big cam-btn" type="button" data-cam>${CAM_SVG(26)}<span>מצלמה</span></button>
        <button class="btn primary big" type="submit">חיפוש</button>
      </div>
    </form>
    <div class="slot-result"></div>`;
  $('#slots').appendChild(el);
  el.querySelector('form.scan').addEventListener('submit', e => { e.preventDefault(); lookup(s.key, el.querySelector('.scan-input').value); });
  el.querySelector('.scan-input').addEventListener('focus', () => { activeKey = s.key; });
  activeKey = s.key;
  renderSlot(s); refresh();
  return s;
}

function removeSlot(key) {
  const i = slots.findIndex(s => s.key === key);
  if (i < 0) return;
  if (slots.length === 1) { resetAll(); return; }
  slots.splice(i, 1); slotEl(key).remove();
  markDuplicates(); slots.forEach(renderSlot); refresh();
  activeKey = slots[slots.length - 1].key;
}

function resetAll() {
  slots = []; $('#slots').innerHTML = ''; $('#invoice').value = ''; $('#buyMsg').hidden = true;
  const s = addSlot(); focusSlot(s.key);
}

function focusSlot(key) { if (!TOUCH) slotEl(key)?.querySelector('.scan-input').focus(); }

function markDuplicates() {
  const seen = new Set();
  for (const s of slots) {
    s.dup = false;
    if (s.status !== 'found') continue;
    if (seen.has(s.student.id)) s.dup = true; else seen.add(s.student.id);
  }
}

async function lookup(key, raw) {
  const s = slotOf(key); if (!s) return;
  const id = String(raw).replace(/\D/g, '');
  if (!id) return;
  $('#saved').hidden = true;
  slotEl(key).querySelector('.scan-input').value = id;
  Object.assign(s, { status: 'loading', query: id, student: null, purchase: null, justAdded: false });
  renderSlot(s); refresh();
  try {
    const r = await api('/api/student/' + encodeURIComponent(id));
    Object.assign(s, { status: 'found', student: r.student, purchase: r.purchase });
  } catch (e) {
    if (e.status === 404) { s.status = 'notfound'; if (!fieldsCache) { try { fieldsCache = (await api('/api/fields')).fields; } catch { fieldsCache = []; } } }
    else { s.status = 'idle'; toast(e.message); }
  }
  markDuplicates(); slots.forEach(renderSlot); refresh();
  if (s.status === 'notfound' && !TOUCH) slotEl(key).querySelector('[data-h]')?.focus();
}

const IDLE_HTML = () => `<button type="button" class="idle cam-start" data-cam>${CAM_SVG(44)}<strong>ממתין לסריקה</strong><span>לחצו כאן לסריקת הברקוד במצלמה, או הקלידו מספר זהות למעלה</span></button>`;
const verdict = (cls, mark, title, sub) => `<div class="verdict ${cls}"><div class="mark" aria-hidden="true">${mark}</div><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div></div>`;

function renderSlot(s) {
  const el = slotEl(s.key); if (!el) return;
  const n = slots.indexOf(s) + 1;
  el.querySelector('.slot-title').textContent = slots.length > 1 ? `אדם ${n} · איתור סטודנט` : 'איתור סטודנט';
  const rm = el.querySelector('[data-remove]');
  rm.hidden = slots.length === 1 && s.status === 'idle';
  rm.textContent = slots.length === 1 ? 'ניקוי' : 'הסרה';
  const out = el.querySelector('.slot-result');
  if (s.status === 'idle') { out.innerHTML = IDLE_HTML(); return; }
  if (s.status === 'loading') { out.innerHTML = '<div class="idle"><strong>מחפש…</strong></div>'; return; }
  if (s.status === 'notfound') { out.innerHTML = notFoundHtml(s); bindAddForm(s); return; }
  const st = s.student, p = s.purchase;
  const v = p ? verdict('v-warn', '!', 'כבר רכש כרטיס', `חשבונית <span class="mono">${esc(p.invoice)}</span> · ${fmtTime(p.updatedAt)}${p.station ? ' · ' + esc(p.station) : ''} · לא ייכלל ברכישה הזו`)
    : s.dup ? verdict('v-bad', '✕', 'כבר נוסף לרכישה הזו', 'אותו אדם מופיע פעמיים. הסירו את השורה הזו.')
    : st.manual ? verdict('v-ok', '✓', s.justAdded ? 'נוסף למאגר' : 'נמצא במאגר', 'נוסף ידנית בעמדה · שנת לימוד 0')
    : verdict('v-ok', '✓', 'נמצא במאגר', 'אמתו את הפרטים מול התעודה');
  const fields = st.fields.filter(([, val]) => val).map(([h, val]) =>
    `<div><span>${esc(h)}</span><b class="${/@/.test(val) ? 'email' : /^[\d\-+ ()]+$/.test(val) ? 'mono' : ''}">${esc(val)}</b></div>`).join('');
  out.innerHTML = `<div class="card">${v}<p class="name">${esc(st.name)}</p>
    <div class="details"><div><span>מספר זהות</span><b class="mono">${esc(st.idDisplay || st.id)}</b></div>${fields}</div></div>`;
}

function notFoundHtml(s) {
  const kind = h => /מייל|דוא"?ל|e-?mail/i.test(h) ? 'email' : /טלפון|נייד|phone|mobile/i.test(h) ? 'tel' : 'text';
  const inputs = (fieldsCache || []).map((f, i) => {
    const k = kind(f.header), id = `nf${s.key}-${i}`;
    return f.year
      ? `<div class="field"><label for="${id}">${esc(f.header)}</label><input id="${id}" value="0" readonly class="mono locked"></div>`
      : `<div class="field"><label for="${id}">${esc(f.header)}</label><input id="${id}" data-h="${esc(f.header)}" type="${k}"${k === 'text' ? '' : ' dir="ltr"'}${k === 'tel' ? ' inputmode="tel"' : ''} autocomplete="off"></div>`;
  }).join('');
  return `<div class="card">
    ${verdict('v-bad', '✕', 'לא נמצא במאגר', `מספר זהות <span class="mono">${esc(s.query)}</span> לא מופיע ברשימת הסטודנטים`)}
    <p class="muted" style="margin:0">בדקו שהמספר נכון. אם צריך, אפשר להוסיף את האדם למאגר כאן. הוא יירשם עם שנת לימוד 0.</p>
    <form class="buy addform" autocomplete="off" novalidate>
      <h3>הוספת אדם חדש למאגר</h3>
      <div class="field"><label for="nfid${s.key}">מספר זהות</label><input id="nfid${s.key}" class="mono nf-id" inputmode="numeric" value="${esc(s.query)}" dir="ltr"></div>
      ${inputs}
      <div class="add-actions"><button class="btn ok big" type="submit">שמירה במאגר</button></div>
      <p class="msg err" hidden></p>
    </form></div>`;
}

function bindAddForm(s) {
  const form = slotEl(s.key).querySelector('form.addform');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const msg = form.querySelector('.msg'), btn = form.querySelector('button[type=submit]'); msg.hidden = true;
    const vals = {}; form.querySelectorAll('[data-h]').forEach(el => { vals[el.dataset.h] = el.value.trim(); });
    const newId = form.querySelector('.nf-id').value.replace(/\D/g, '');
    const nameKeys = Object.keys(vals).filter(h => /שם/.test(h) || /name/i.test(h));
    const fail = (t, el) => { msg.textContent = t; msg.hidden = false; el?.focus(); };
    if (!newId) return fail('הזינו מספר זהות', form.querySelector('.nf-id'));
    if (nameKeys.length && nameKeys.every(h => !vals[h])) return fail('הזינו שם', form.querySelector(`[data-h="${CSS.escape(nameKeys[0])}"]`));
    const bad = [...form.querySelectorAll('input[type=email]')].find(el => el.value && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
    if (bad) return fail('כתובת המייל לא תקינה', bad);
    btn.disabled = true;
    try {
      const r = await api('/api/student', { method: 'POST', body: JSON.stringify({ id: newId, fields: vals, station: station.get() }) });
      Object.assign(s, { status: 'found', student: r.student, purchase: null, justAdded: true, query: newId });
      slotEl(s.key).querySelector('.scan-input').value = newId;
      markDuplicates(); slots.forEach(renderSlot); refresh();
      toast('נוסף למאגר: ' + r.student.name);
    } catch (err) { btn.disabled = false; fail(err.message); }
  });
}

/* ---------- add-person button + checkout ---------- */
function refresh() {
  const cart = slots.filter(inCart);
  const last = slots[slots.length - 1];
  const lastDone = last && (last.status === 'found');
  $('#addRow').hidden = !(cart.length && lastDone);
  $('#checkout').hidden = !cart.length;
  $('#cartList').innerHTML = cart.map(s => `<li><span>${esc(s.student.name)}</span><span class="mono">${esc(s.student.idDisplay || s.student.id)}</span><span class="pill-t">כרטיס 1</span></li>`).join('');
  const blocked = slots.some(s => s.status === 'found' && (s.purchase || s.dup)) || slots.some(s => s.status === 'notfound' || s.status === 'loading');
  $('#saveBtn').textContent = cart.length > 1 ? `שמירה · ${cart.length} כרטיסים` : 'שמירה · כרטיס 1';
  $('.checkout-title').textContent = `רישום רכישה · ${cart.length} ${cart.length === 1 ? 'אדם' : 'אנשים'}`;
  $('#checkout').classList.toggle('has-blocked', blocked);
}

$('#addPerson').addEventListener('click', () => {
  const s = addSlot();
  slotEl(s.key).scrollIntoView({ behavior: 'smooth', block: 'start' });
  focusSlot(s.key);
});
$('#cancelAll').addEventListener('click', () => { $('#saved').hidden = true; resetAll(); window.scrollTo({ top: 0 }); });

$('#buyForm').addEventListener('submit', ev => { ev.preventDefault(); save(false); });
async function save(force) {
  const msg = $('#buyMsg'), invoice = $('#invoice').value.trim(); msg.hidden = true;
  const cart = slots.filter(inCart);
  const err = (t, cls = 'err') => { msg.className = 'msg ' + cls; msg.innerHTML = t; msg.hidden = false; };
  if (slots.some(s => s.status === 'notfound')) return err('יש אדם שלא נמצא במאגר. הוסיפו אותו או הסירו את השורה.');
  if (slots.some(s => s.status === 'idle' || s.status === 'loading')) return err('יש שורת איתור ריקה. חפשו אדם או הסירו את השורה.');
  if (slots.some(s => s.dup)) return err('אותו אדם מופיע פעמיים. הסירו את השורה הכפולה.');
  if (slots.some(s => s.purchase)) return err('יש אדם שכבר רכש כרטיס. הסירו אותו מהרכישה.');
  if (!cart.length) return;
  if (!invoice) { err('הזינו מספר חשבונית'); $('#invoice').focus(); return; }
  $('#saveBtn').disabled = true;
  try {
    const r = await api('/api/purchases', { method: 'POST', body: JSON.stringify({ studentIds: cart.map(s => s.student.id), invoice, station: station.get(), force }) });
    $('#saved').innerHTML = `✓ נשמר · חשבונית <span class="mono">${esc(r.invoice)}</span> · ${r.saved.length} ${r.saved.length === 1 ? 'כרטיס' : 'כרטיסים'}: ${r.saved.map(p => esc(p.name)).join(', ')}`;
    $('#saved').hidden = false;
    resetAll(); window.scrollTo({ top: 0 });
  } catch (e) {
    if (e.data && e.data.duplicateInvoice) {
      err(esc(e.message) + ' <button type="button" class="btn" id="forceBtn">לשמור בכל זאת</button>', 'warn');
      $('#forceBtn').addEventListener('click', () => save(true));
    } else err(esc(e.message));
    if (e.data && e.data.taken) { for (const s of slots) if (s.student && e.data.taken.includes(s.student.id)) { s.purchase = { invoice: '?', updatedAt: new Date() }; } slots.forEach(renderSlot); refresh(); }
  } finally { $('#saveBtn').disabled = false; }
}

/* ---------- camera scanning ---------- */
const SCAN_LIB = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
let libPromise = null, scanner = null, handled = false, camTarget = null;
function loadLib() {
  if (window.Html5Qrcode) return Promise.resolve();
  return libPromise ||= new Promise((ok, fail) => {
    const sc = document.createElement('script'); sc.src = SCAN_LIB; sc.onload = ok;
    sc.onerror = () => { libPromise = null; fail(new Error('lib')); }; document.head.appendChild(sc);
  });
}
async function openCamera(key) {
  camTarget = key;
  $('#camOverlay').hidden = false; $('#camMsg').textContent = 'מפעיל מצלמה…'; handled = false;
  try {
    await loadLib();
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('camView', {
      verbose: false,
      formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.CODABAR, F.ITF, F.EAN_13, F.EAN_8, F.UPC_A, F.QR_CODE, F.PDF_417, F.DATA_MATRIX],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    await scanner.start({ facingMode: 'environment' }, {
      fps: 12,
      qrbox: (w, h) => ({ width: Math.floor(w * 0.88), height: Math.floor(Math.min(h * 0.6, w * 0.5)) }),
    }, onCode, () => {});
    $('#camMsg').textContent = 'מחזיקים את התעודה יציבה, הסריקה אוטומטית';
  } catch (e) {
    const name = (e && (e.name || '')) + ' ' + String(e && e.message || e);
    $('#camMsg').textContent = /lib/.test(name) ? 'לא הצלחנו לטעון את רכיב הסריקה. בדקו את החיבור לאינטרנט ונסו שוב.'
      : /NotAllowed|Permission|denied/i.test(name) ? 'אין הרשאה למצלמה. אשרו גישה למצלמה בהגדרות הדפדפן ונסו שוב.'
      : /NotFound|no camera|Requested device/i.test(name) ? 'לא נמצאה מצלמה במכשיר הזה.'
      : 'לא הצלחנו להפעיל את המצלמה. סגרו ונסו שוב.';
  }
}
async function closeCamera() {
  try { if (scanner && scanner.isScanning) await scanner.stop(); } catch {}
  try { if (scanner) scanner.clear(); } catch {}
  scanner = null; $('#camOverlay').hidden = true;
}
async function onCode(text) {
  const id = String(text || '').replace(/\D/g, '');
  if (handled || !id) return;
  handled = true;
  try { navigator.vibrate && navigator.vibrate(80); } catch {}
  await closeCamera();
  lookup(camTarget, id);
}
document.addEventListener('click', e => {
  const cam = e.target.closest('[data-cam]');
  if (cam) { const sl = cam.closest('.slot'); openCamera(sl ? +sl.dataset.key : activeKey); return; }
  const rm = e.target.closest('[data-remove]');
  if (rm) removeSlot(+rm.closest('.slot').dataset.key);
});
$('#camClose').addEventListener('click', closeCamera);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#camOverlay').hidden) { closeCamera(); return; }
  // a USB scanner "types" digits — send them to the current search box even when focus is elsewhere
  const tag = document.activeElement && document.activeElement.tagName;
  if (/^[0-9]$/.test(e.key) && !['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) {
    const target = [...slots].reverse().find(s => s.status === 'idle') || slotOf(activeKey) || slots[slots.length - 1];
    const inp = slotEl(target.key).querySelector('.scan-input'); inp.value = ''; inp.focus();
  }
});

resetAll();
</script>
</body>
</html>
