<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>איתור סטודנט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>איתור סטודנט</h1>
    <nav class="nav">
      <a href="/">איתור</a>
      <a href="/purchases">רשימת רכישות</a>
      <a href="/admin" data-admin hidden>ניהול</a>
      <button id="logout" type="button">יציאה</button>
    </nav>
  </header>

  <div id="noList" class="banner warn" hidden>עדיין לא הועלה קובץ סטודנטים. מנהל צריך להעלות אותו בעמוד "ניהול".</div>

  <form class="scan" id="scanForm" autocomplete="off">
    <label for="scan">סריקת ברקוד או הקלדת מספר זהות</label>
    <input id="scan" inputmode="numeric" placeholder="מספר זהות">
    <div class="scan-actions">
      <button class="btn big cam-btn" type="button" data-cam><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg><span>מצלמה</span></button>
      <button class="btn primary big" type="submit">חיפוש</button>
    </div>
    <div class="hint">בטלפון או טאבלט: לוחצים "מצלמה" ומכוונים לברקוד. סורק ברקוד USB מקליד את המספר ולוחץ Enter לבד. בהקלדה ידנית לוחצים <kbd>Enter</kbd>. <kbd>Esc</kbd> מנקה את המסך.</div>
  </form>

  <div id="saved" class="banner ok" hidden></div>
  <section id="result"><button type="button" class="idle cam-start" data-cam><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg><strong>ממתין לסריקה</strong><span>לחצו כאן לסריקת הברקוד במצלמה, או הקלידו מספר זהות למעלה</span></button></section>
</div>
<div class="cam-overlay" id="camOverlay" hidden role="dialog" aria-modal="true" aria-label="סריקה במצלמה">
  <div class="cam-box">
    <p class="cam-title">כוונו את המצלמה לברקוד שעל התעודה</p>
    <div id="camView"></div>
    <p class="cam-msg" id="camMsg">מפעיל מצלמה…</p>
    <button class="btn big" type="button" id="camClose">ביטול</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/common.js"></script>
<script>
let current = null;
const IDLE = '<button type="button" class="idle cam-start" data-cam><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg><strong>ממתין לסריקה</strong><span>לחצו כאן לסריקת הברקוד במצלמה, או הקלידו מספר זהות למעלה</span></button>';
const TOUCH = matchMedia('(pointer: coarse)').matches;
const focusScan = () => { if (!TOUCH) $('#scan').focus(); };
focusScan();

document.addEventListener('me', e => { $('#noList').hidden = e.detail.students > 0; });

function reset(keepSaved) {
  current = null; $('#result').innerHTML = IDLE; $('#scan').value = ''; focusScan();
  if (!keepSaved) $('#saved').hidden = true;
}

async function lookup(raw) {
  const id = String(raw).replace(/\D/g, '');
  if (!id) return;
  $('#saved').hidden = true;
  $('#result').innerHTML = '<div class="idle"><strong>מחפש…</strong></div>';
  try {
    const { student, purchase } = await api('/api/student/' + encodeURIComponent(id));
    current = { student, purchase };
    render();
  } catch (e) {
    if (e.status === 404) {
      $('#result').innerHTML = `<div class="card">
        <div class="verdict v-bad"><div class="mark" aria-hidden="true">✕</div><div><h2>לא נמצא במאגר</h2><p>מספר זהות <span class="mono">${esc(id)}</span> לא מופיע ברשימת הסטודנטים</p></div></div>
        <p class="muted" style="margin:0">בדקו שהמספר הוקלד נכון ונסו שוב. אם הסטודנט מציג אישור תקף – פנו לאחראי המשמרת.</p></div>`;
    } else { $('#result').innerHTML = IDLE; toast(e.message); }
  }
  if (!TOUCH) $('#scan').select();
}

function render() {
  const { student: s, purchase: p } = current;
  const verdict = p
    ? `<div class="verdict v-warn"><div class="mark" aria-hidden="true">!</div><div><h2>כבר רכש ${p.tickets} כרטיסים</h2><p>חשבונית <span class="mono">${esc(p.invoice)}</span> · ${fmtTime(p.updatedAt)}${p.station ? ' · ' + esc(p.station) : ''}</p></div></div>`
    : `<div class="verdict v-ok"><div class="mark" aria-hidden="true">✓</div><div><h2>נמצא במאגר</h2><p>אמתו את הפרטים מול התעודה</p></div></div>`;
  const fields = s.fields.filter(([, v]) => v).map(([h, v]) =>
    `<div><span>${esc(h)}</span><b class="${/@/.test(v) ? 'email' : /^[\d\-+ ()]+$/.test(v) ? 'mono' : ''}">${esc(v)}</b></div>`).join('');
  const opts = [1, 2, 3, 4, 5].map(n => `<option value="${n}" ${p && p.tickets === n ? 'selected' : ''}>${n}</option>`).join('');
  $('#result').innerHTML = `<div class="card">
    ${verdict}
    <p class="name">${esc(s.name)}</p>
    <div class="details"><div><span>מספר זהות</span><b class="mono">${esc(s.idDisplay || s.id)}</b></div>${fields}</div>
    <form class="buy" id="buyForm" autocomplete="off">
      <h3>${p ? 'עדכון רכישה קיימת' : 'רישום רכישה'}</h3>
      <div class="field"><label for="tickets">מספר כרטיסים שנרכשו</label>
        <select id="tickets" required><option value="" ${p ? '' : 'selected'} disabled>בחרו</option>${opts}</select></div>
      <div class="field"><label for="invoice">מספר חשבונית</label>
        <input id="invoice" class="mono" value="${p ? esc(p.invoice) : ''}" required></div>
      <button class="btn ok big" type="submit" id="saveBtn">${p ? 'שמירת עדכון' : 'שמירה'}</button>
      <p class="msg" id="buyMsg" hidden></p>
    </form></div>`;
  $('#buyForm').addEventListener('submit', ev => { ev.preventDefault(); save(false); });
}

async function save(force) {
  const tickets = $('#tickets').value, invoice = $('#invoice').value.trim(), msg = $('#buyMsg');
  msg.hidden = true;
  if (!tickets) { msg.className = 'msg err'; msg.textContent = 'בחרו מספר כרטיסים'; msg.hidden = false; $('#tickets').focus(); return; }
  if (!invoice) { msg.className = 'msg err'; msg.textContent = 'הזינו מספר חשבונית'; msg.hidden = false; $('#invoice').focus(); return; }
  $('#saveBtn').disabled = true;
  try {
    const r = await api('/api/purchase', { method: 'POST', body: JSON.stringify({ studentId: current.student.id, tickets, invoice, station: station.get(), force }) });
    $('#saved').textContent = `✓ ${r.updated ? 'עודכן' : 'נשמר'}: ${current.student.name} · ${r.purchase.tickets} כרטיסים · חשבונית ${r.purchase.invoice}`;
    $('#saved').hidden = false;
    reset(true);
  } catch (e) {
    $('#saveBtn').disabled = false;
    msg.className = 'msg ' + (e.data && e.data.duplicateInvoice ? 'warn' : 'err');
    msg.innerHTML = esc(e.message) + (e.data && e.data.duplicateInvoice ? ' <button type="button" class="btn" id="forceBtn">לשמור בכל זאת</button>' : '');
    msg.hidden = false;
    const f = $('#forceBtn'); if (f) f.addEventListener('click', () => save(true));
  }
}

/* ---------- camera scanning ---------- */
const SCAN_LIB = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
let libPromise = null, scanner = null, handled = false;
function loadLib() {
  if (window.Html5Qrcode) return Promise.resolve();
  return libPromise ||= new Promise((ok, fail) => {
    const sc = document.createElement('script'); sc.src = SCAN_LIB; sc.onload = ok;
    sc.onerror = () => { libPromise = null; fail(new Error('lib')); }; document.head.appendChild(sc);
  });
}
async function openCamera() {
  $('#camOverlay').hidden = false; $('#camMsg').textContent = 'מפעיל מצלמה…'; handled = false;
  try {
    await loadLib();
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('camView', {
      verbose: false,
      formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.CODABAR, F.ITF, F.EAN_13, F.EAN_8, F.UPC_A, F.QR_CODE, F.PDF_417, F.DATA_MATRIX],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    await scanner.start({ facingMode: 'environment' }, {
      fps: 12,
      qrbox: (w, h) => ({ width: Math.floor(w * 0.88), height: Math.floor(Math.min(h * 0.6, w * 0.5)) }),
    }, onCode, () => {});
    $('#camMsg').textContent = 'מחזיקים את התעודה יציבה, הסריקה אוטומטית';
  } catch (e) {
    const name = (e && (e.name || '')) + ' ' + String(e && e.message || e);
    $('#camMsg').textContent = /lib/.test(name) ? 'לא הצלחנו לטעון את רכיב הסריקה. בדקו את החיבור לאינטרנט ונסו שוב.'
      : /NotAllowed|Permission|denied/i.test(name) ? 'אין הרשאה למצלמה. אשרו גישה למצלמה בהגדרות הדפדפן ונסו שוב.'
      : /NotFound|no camera|Requested device/i.test(name) ? 'לא נמצאה מצלמה במכשיר הזה.'
      : 'לא הצלחנו להפעיל את המצלמה. סגרו ונסו שוב.';
  }
}
async function closeCamera() {
  try { if (scanner && scanner.isScanning) await scanner.stop(); } catch {}
  try { if (scanner) scanner.clear(); } catch {}
  scanner = null; $('#camOverlay').hidden = true;
}
async function onCode(text) {
  const id = String(text || '').replace(/\D/g, '');
  if (handled || !id) return;
  handled = true;
  try { navigator.vibrate && navigator.vibrate(80); } catch {}
  await closeCamera();
  $('#scan').value = id;
  lookup(id);
}
document.addEventListener('click', e => { if (e.target.closest('[data-cam]')) openCamera(); });
$('#camClose').addEventListener('click', closeCamera);

$('#scanForm').addEventListener('submit', e => { e.preventDefault(); lookup($('#scan').value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#camOverlay').hidden) { closeCamera(); return; } reset(); return; }
  // a scanner "types" digits — catch them even when focus is elsewhere
  const tag = document.activeElement && document.activeElement.tagName;
  if (/^[0-9]$/.test(e.key) && !['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) { $('#scan').value = ''; $('#scan').focus(); }
});
</script>
</body>
</html>
