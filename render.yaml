services:
  - type: web
    name: student-tickets
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-tickets-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: student-tickets-db
    plan: free
    region: frankfurt
