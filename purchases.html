<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>רשימת רכישות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>רשימת רכישות</h1>
    <nav class="nav">
      <a href="/">איתור</a>
      <a href="/purchases">רשימת רכישות</a>
      <a href="/admin" data-admin hidden>ניהול</a>
      <button id="logout" type="button">יציאה</button>
    </nav>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <input id="q" placeholder="חיפוש לפי שם, מספר זהות או חשבונית">
    <button class="btn" id="refresh">רענון</button>
    <button class="btn" type="button" id="exportBtn" data-admin hidden>הורדה לאקסל</button>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>עודכן</th><th>שם</th><th>מספר זהות</th><th>כרטיסים</th><th>חשבונית</th><th>מחיר</th><th>עמדה</th><th class="mailcol" hidden>מייל</th><th data-admin hidden></th></tr></thead>
    <tbody id="body"><tr><td colspan="10" class="muted">טוען…</td></tr></tbody>
  </table></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/static/common.js"></script>
<script src="/static/excel.js"></script>
<script>
let all = [], askDel = null, editMail = null, mailOn = false, scope = 'all', myStation = '';
async function load() {
  try { const r = await api('/api/purchases'); all = r.purchases; mailOn = r.mail; scope = r.scope || 'all'; myStation = r.station || ''; if (!editMail) render(); } catch (e) { if (e.message !== 'auth') toast(e.message); }
}
function mailCell(p) {
  const st = p.emailStatus;
  if (editMail === p.studentId) return `<form class="mailedit" data-mailform="${esc(p.studentId)}" novalidate>
      <input type="email" dir="ltr" class="me-input" value="${esc(p.emailTo || '')}" placeholder="כתובת מייל">
      <button class="btn mini ok" type="submit">שליחה</button><button class="btn mini" type="button" data-mailcancel>ביטול</button></form>`;
  const btn = `<button class="btn mini" data-resend="${esc(p.studentId)}">שליחה חוזרת</button>`;
  const to = p.emailTo ? `<span class="mail-to" dir="ltr">${esc(p.emailTo)}</span>` : '';
  if (st === 'sent') return `<span class="mail ok">✓ נשלח</span> ${to} ${btn}`;
  if (st === 'sending') return `<span class="mail">שולח…</span>`;
  if (st === 'no_email') return `<span class="mail muted">אין מייל</span> ${btn}`;
  if (st === 'failed') return `<span class="mail bad" title="${esc(p.emailError || '')}">✗ נכשל</span> ${to} ${btn}`;
  return btn;
}
function render() {
  document.querySelector('.mailcol').hidden = !mailOn;
  const t = all.reduce((s, p) => s + p.tickets, 0);
  const tx = new Set(all.map(p => p.invoice.toLowerCase())).size;
  const scopeNote = scope === 'station' ? `<p class="muted scope-note">מוצגות רק המכירות של עמדה ${esc(myStation)}</p>` : '';
  $('#kpis').innerHTML = scopeNote + `<div class="kpi"><span>אנשים עם כרטיס</span><b>${all.length}</b></div><div class="kpi"><span>סה"כ כרטיסים</span><b>${t}</b></div><div class="kpi"><span>חשבוניות</span><b>${tx}</b></div>${scope === 'all' ? `<div class="kpi"><span>בנים</span><b>${all.filter(p => p.gender === 'm').length}</b></div><div class="kpi"><span>בנות</span><b>${all.filter(p => p.gender === 'f').length}</b>${all.some(p => !p.gender) ? `<small class="muted">ללא מגדר: ${all.filter(p => !p.gender).length}</small>` : ''}</div>` : ''}<div class="kpi"><span>סה"כ נגבה</span><b>${all.reduce((a, p) => a + (p.price || 0), 0).toLocaleString('he-IL')} ₪</b></div>`;
  const q = $('#q').value.trim().toLowerCase();
  const rows = all.filter(p => !q || [p.name, p.studentId, p.invoice, p.station].join(' ').toLowerCase().includes(q));
  const admin = window.me && window.me.role === 'admin';
  $('#body').innerHTML = rows.length ? rows.map(p => `<tr>
    <td class="num">${fmtTime(p.updatedAt)}</td><td><b>${esc(p.name)}</b></td><td class="num">${esc(p.studentId)}</td>
    <td class="num">${p.tickets}</td><td class="num">${esc(p.invoice)}</td><td class="num">${p.price != null ? `${p.price} ₪ <span class="muted">${p.priceType === 'guest' ? 'אורח' : 'סטודנט'}</span>` : '—'}</td><td>${esc(p.station || '')}</td>
    ${mailOn ? `<td>${mailCell(p)}</td>` : ''}
    ${admin ? `<td>${askDel === p.studentId ? `<button class="btn danger" data-del="${esc(p.studentId)}">למחוק?</button> <button class="btn" data-no>לא</button>` : `<button class="btn" data-ask="${esc(p.studentId)}">מחיקה</button>`}</td>` : ''}
  </tr>`).join('') : `<tr><td colspan="10" class="muted">${q ? 'אין תוצאות לחיפוש.' : (scope === 'station' ? 'עדיין לא נרשמו רכישות בעמדה הזו. ' : 'עדיין לא נרשמו רכישות. ') + 'רכישה שתישמר בעמוד האיתור תופיע כאן.'}</td></tr>`;
}
document.addEventListener('me', render);
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-ask]'); if (a) { askDel = a.dataset.ask; render(); return; }
  if (e.target.closest('[data-no]')) { askDel = null; render(); return; }
  const rs = e.target.closest('[data-resend]');
  if (rs) { editMail = rs.dataset.resend; render(); const i = document.querySelector('.me-input'); if (i) { i.focus(); i.select(); } return; }
  if (e.target.closest('[data-mailcancel]')) { editMail = null; render(); return; }
  const d = e.target.closest('[data-del]');
  if (d) { try { await api('/api/purchase/' + d.dataset.del, { method: 'DELETE' }); askDel = null; toast('הרכישה נמחקה'); load(); } catch (err) { toast(err.message); } }
});
// Resend the confirmation, optionally to a corrected address (it is also saved for that person).
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-mailform]'); if (!f) return;
  e.preventDefault();
  const email = f.querySelector('.me-input').value.trim(), btn = f.querySelector('button[type=submit]');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('כתובת המייל לא תקינה'); return; }
  btn.disabled = true; btn.textContent = 'שולח…';
  try { const r = await api('/api/mail/resend/' + encodeURIComponent(f.dataset.mailform), { method: 'POST', body: JSON.stringify({ email }) }); toast('נשלח אל ' + r.to); editMail = null; }
  catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'שליחה'; return; }
  load();
});
$('#q').addEventListener('input', render);
$('#refresh').addEventListener('click', load);
$('#exportBtn').addEventListener('click', () => downloadPurchasesXlsx().catch(e => toast(e.message)));
load(); setInterval(load, 20000);
</script>
</body>
</html>
